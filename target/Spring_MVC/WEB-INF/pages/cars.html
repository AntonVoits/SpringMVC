<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cars</title>
</head>
<body>
<table class="table">
  <thead>
  <tr>
    <th scope="col">ID</th>
    <th scope="col">Make</th>
    <th scope="col">Model</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="car : ${cars}">
      <td th:text="${car.getId()}">
      <td th:text="${car.getMake()}">
      <td th:text="${car.getModel()}">
      </td>
  </tr>
  </tbody>
</table>
</body>
</html>
